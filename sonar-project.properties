sonar.projectKey=ledgerline
sonar.projectName=Ledgerline
sonar.sources=app,components,lib,types
sonar.sourceEncoding=UTF-8

# The exported Claude Design canvas is the design specification, not code we
# own: it ships a vendored runtime bundle and a template-dialect HTML file.
# Analysing it reports on generated third-party output. See AGENTS.md, part 1.
sonar.exclusions=Ledgerline/**,.next/**,node_modules/**,public/**

# Fixtures ported verbatim from the artboard. They are long literal tables by
# nature, so the duplication detector has nothing useful to say about them.
sonar.cpd.exclusions=lib/data/**
